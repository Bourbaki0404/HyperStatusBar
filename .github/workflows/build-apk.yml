name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Prepare signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > ci-signing.keystore
          printf 'storeFile=ci-signing.keystore\nstorePassword=%s\nkeyAlias=hyperstatusbar\nkeyPassword=%s\n' "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > signing.properties
      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain "-Pandroid.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HyperStatusBar-1.1.0.apk
          cd dist
          sha256sum HyperStatusBar-1.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HyperStatusBar-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -f ci-signing.keystore signing.properties
